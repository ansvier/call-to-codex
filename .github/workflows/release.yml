name: Build release downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        run: echo "CALLTOCODEX_RELEASE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)" >> "$GITHUB_ENV"
      - name: Check native audio processing
        run: ./scripts/test.sh
      - name: Build standalone app, DMG and ZIP
        run: ./scripts/build.sh
      - name: Check quiet background noise (CPU)
        env:
          CALLTOCODEX_TEST_CPU_ONLY: '1'
          CALLTOCODEX_TEST_QUIET_ONLY: '1'
        run: ./scripts/test-transcription.sh
      - name: Verify signature and dependencies
        shell: bash
        run: |
          set -euo pipefail
          app=dist/CallToCodex.app
          codesign --verify --deep --strict "$app"
          for binary in "$app/Contents/MacOS/CallToCodex" "$app/Contents/Resources/CallToCodexProcessor" "$app/Contents/Resources/whisper-cli"; do
            while IFS= read -r dependency; do
              case "$dependency" in
                /System/Library/*|/usr/lib/*) ;;
                *) echo "Unexpected runtime dependency: $dependency" >&2; exit 1 ;;
              esac
            done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')
          done
          hdiutil verify "dist/CallToCodex-$CALLTOCODEX_RELEASE_VERSION-macOS-arm64.dmg"
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      - name: Upload files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$CALLTOCODEX_RELEASE_VERSION"
          test "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$release_tag" "dist/CallToCodex-$CALLTOCODEX_RELEASE_VERSION-macOS-arm64.dmg" "dist/CallToCodex-$CALLTOCODEX_RELEASE_VERSION-macOS-arm64.zip" dist/SHA256SUMS.txt --clobber
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
